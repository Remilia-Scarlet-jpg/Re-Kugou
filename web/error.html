<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE:KG · 正在启动</title>
<!--
  兜底页(capacitor.config.json 的 server.errorPath 指向本文件):
  主页面(http://localhost:3001)还没起来时,WebView 会加载这一页,而不是 Chromium 的报错页。
  内置 Node 服务启动通常要 1~3 秒,所以这里自动重试;连续失败就把排查线索摆出来。
  ⚠️ 页内写死 http://localhost:3001,与 capacitor.config.json 的 server.url 一致,改一处要同步。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #08090b;
    color: #e8ecef;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    width: 100%; max-width: 420px;
    padding: 28px 24px 22px;
    border-radius: 22px;
    background: linear-gradient(112deg, rgba(62, 66, 70, .34), rgba(18, 22, 26, .28) 48%, rgba(8, 12, 14, .34));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 18px 60px rgba(0, 0, 0, .45);
    backdrop-filter: blur(14px) saturate(1.25);
    -webkit-backdrop-filter: blur(14px) saturate(1.25);
    text-align: center;
  }
  .logo {
    font-size: 26px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, #00f5d4, #2442ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status { margin-top: 14px; font-size: 14px; color: #c8d0d8; min-height: 22px; }
  .sub { margin-top: 6px; font-size: 12px; color: #8a9099; min-height: 18px; }
  .dot {
    display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
    background: #00f5d4; box-shadow: 0 0 10px rgba(0, 245, 212, .8);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  button {
    margin-top: 18px; width: 100%; min-height: 44px;
    border: none; border-radius: 14px;
    font-size: 14px; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, #00f5d4, #2442ff);
  }
  button:active { transform: scale(.98); }
  .hint {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, .08);
    font-size: 11px; color: #6f7780; text-align: left; line-height: 1.7;
  }
  code { font-family: Consolas, 'Courier New', monospace; color: #9fb3c8; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">RE:KG</div>
    <div class="status"><span class="dot"></span><span id="status">正在启动内置服务…</span></div>
    <div class="sub" id="sub">首次启动需要几秒,音乐数据全部在你手机本地运行</div>
    <button id="retry">立即重试</button>
    <div class="hint">
      一直停在这里,说明应用内的 Node 服务没能起来。<br>
      抓日志(USB 连接电脑后):
      <code>adb logcat -s CapacitorNodeJS:* capacitor-nodejs:* Capacitor/Console:* chromium:*</code><br>
      也可以先到系统设置里允许 REKG「无限制」后台运行再重试。
    </div>
  </div>
<script>
  (function () {
    var APP_URL = 'http://localhost:3001/';
    var MAX = 10;           // 自动重试 10 次,每次 1.5s ≈ 15 秒
    var waited = 0;
    var timer = null;
    var statusEl = document.getElementById('status');
    var subEl = document.getElementById('sub');
    var btn = document.getElementById('retry');

    function go() {
      location.replace(APP_URL);
    }

    function tick() {
      waited++;
      statusEl.textContent = '正在启动内置服务…(第 ' + waited + ' 次尝试)';
      if (waited >= MAX) {
        clearInterval(timer);
        statusEl.textContent = '启动失败:内置服务没有在预期时间内响应';
        subEl.textContent = '点下面的按钮再试一次,或按上面的方法抓日志';
        return;
      }
      go();
    }

    btn.addEventListener('click', function () {
      clearInterval(timer);
      waited = 0;
      statusEl.textContent = '重新尝试…';
      go();
    });

    // 每 1.5s 试一次(页面被替换掉后定时器自然消失)
    timer = setInterval(tick, 1500);
    // 首次稍等一下再跳,避免服务正好在启动中的瞬间撞上
    setTimeout(tick, 900);
  })();
</script>
</body>
</html>
